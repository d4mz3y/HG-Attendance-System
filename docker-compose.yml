services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hg_attendance}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
      MYSQL_USER: ${DB_USERNAME:-hg_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_app}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME:-hg_user}", "-p${DB_PASSWORD:-change_me_app}"]
      interval: 4s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    env_file:
      - .env.docker
    environment:
      APP_NAME: "Hogan Guards Attendance"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Africa/Lagos
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-hg_attendance}
      DB_USERNAME: ${DB_USERNAME:-hg_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_app}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      FILESYSTEM_DISK: public
      COMPOSER_NO_BLOCKING: "1"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  volumes:
    mysql_data:
