name: hg-attendance

services:
  mysql:
    image: mysql:8.4
    command:
      - --local-infile=0
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.docker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  app:
    image: hg-attendance-app:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG in .env.docker}
    build: .
    ports:
      - "${ZEROTIER_BIND_ADDRESS:?Set ZEROTIER_BIND_ADDRESS in .env.docker}:${APP_PORT:?Set APP_PORT in .env.docker}:8443"
      - "${LAN_BIND_ADDRESS:?Set LAN_BIND_ADDRESS in .env.docker}:${APP_PORT:?Set APP_PORT in .env.docker}:8443"
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL in .env.docker}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ""
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      SESSION_DRIVER: file
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      QUEUE_CONNECTION: sync
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:?Set PAYSTACK_PUBLIC_KEY in .env.docker}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:?Set PAYSTACK_SECRET_KEY in .env.docker}
      PAYSTACK_CURRENCY: ${PAYSTACK_CURRENCY:?Set PAYSTACK_CURRENCY in .env.docker}
      PAYSTACK_MONTHLY_AMOUNT: ${PAYSTACK_MONTHLY_AMOUNT:?Set PAYSTACK_MONTHLY_AMOUNT in .env.docker}
      PAYSTACK_YEARLY_AMOUNT: ${PAYSTACK_YEARLY_AMOUNT:?Set PAYSTACK_YEARLY_AMOUNT in .env.docker}
      SUBSCRIPTION_TRIAL_START: ${SUBSCRIPTION_TRIAL_START:?Set SUBSCRIPTION_TRIAL_START in .env.docker}
      SUBSCRIPTION_TRIAL_END: ${SUBSCRIPTION_TRIAL_END:?Set SUBSCRIPTION_TRIAL_END in .env.docker}
      BILLING_EMAIL: ${BILLING_EMAIL:?Set BILLING_EMAIL in .env.docker}
    volumes:
      - app_storage:/var/www/html/storage
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH in .env.docker}:/run/secrets/hg-attendance.crt:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH in .env.docker}:/run/secrets/hg-attendance.key:ro
    group_add:
      - ${TLS_KEY_GROUP_ID:?Set TLS_KEY_GROUP_ID in .env.docker}
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
      - /var/www/html/bootstrap/cache:size=16m,uid=33,gid=33,mode=0755,noexec,nosuid,nodev
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--insecure", "--silent", "https://127.0.0.1:8443/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  mysql_data:
  app_storage:
